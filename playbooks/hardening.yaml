---
- hosts: linux
  become: true

  tasks:

  - name: Update all installed packages in CentOS
    ansible.builtin.dnf:
      name: "*"
      state: latest
    notify: Reboot Servers
    when: ansible_os_family == "RedHat"

  - name: Update all installed packages in Ubuntu
    ansible.builtin.apt:
      name: "*"
      state: latest
      update_cache: true
    notify: Reboot Servers
    when: ansible_os_family == "Debian"  

  handlers:

  - name: Reboot Servers
    ansible.builtin.reboot:

